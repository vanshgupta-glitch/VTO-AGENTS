id: opencode
display_name: VTO OpenCode
tier: 3
kind: executor
runtime: opencode
# opencode/big-pickle hangs indefinitely on this machine -- it opened a run that
# never returned, and the bridge sat on it for the full 900s timeout. The -free
# tier answers in seconds and costs nothing, which also satisfies the owner
# directive that checks must not spend. Verified 2026-08-12.
model: opencode/nemotron-3.5-lightning-free
token_env: SLACK_BOT_OPENCODE
primary_channel: swarm-scout
also_reads: [swarm-research]
# WEB-FETCHER ONLY (owner directive 2026-08-10): free, fast, high-volume/redundant data
# gathering. NOT a code writer — code.*/build/test belong to Coder+Critic (qwen3-coder-flash)
# and the TestRunner/VideoTester/Accuracy operation-personas.
capabilities: [web.fetch, web.render, web.scrape, file.read, file.write]
allowed_operations: [web.fetch, web.render, web.screenshot, web.har, file.read, file.write, file.glob, file.grep]
skills: []
knowledge: [swarm-protocol@^1, vto-domain@^1, shopify-conventions@^1]
recovery:
  max_attempts: 2
  escalates_to: admin
  consult_solutions: true
reports:
  on_success: admin
  on_escalation: admin
enabled: true